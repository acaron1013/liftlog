<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10182a"><title>LiftLog • Training</title><style>
:root{color-scheme:dark;--bg:#0d1423;--panel:#19243a;--line:#31405c;--text:#f4f7ff;--muted:#aab9d2;--accent:#67e0b3;--warn:#ffd18c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,sans-serif}button,input,select{font:inherit}button{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#263550;color:var(--text);cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--accent)}button.active,.primary{background:var(--accent);color:#10251e;font-weight:750;border-color:var(--accent)}button:disabled{opacity:.45}input,select{background:#101b2e;border:1px solid var(--line);border-radius:10px;color:var(--text);padding:10px;min-width:0}input[type=number]{width:100%}a{color:var(--accent)}.wrap{max-width:780px;margin:auto;padding:16px}.head{display:flex;justify-content:space-between;align-items:center;gap:8px}.logo{font-size:25px;font-weight:850}.logo b{color:var(--accent)}.muted{color:var(--muted)}.small{font-size:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pill{padding:8px 10px}.exercise{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin:8px 0;padding:14px}.exercise .badge{width:42px;height:42px;display:grid;place-items:center;background:#344560;border-radius:12px;font-size:22px}.grow{flex:1}.done{color:var(--accent)}h1{font-size:23px;margin:12px 0 4px}h2{font-size:18px;margin:0 0 12px}.hidden{display:none!important}.stack{display:grid;gap:8px}.set{display:grid;grid-template-columns:30px 1fr 1fr 32px;gap:8px;align-items:center;margin:7px 0}.set button{padding:9px 0}.tabs{display:flex;gap:7px;overflow-x:auto;margin:14px 0}.tabs button{white-space:nowrap}.note{background:#28334a;border-left:3px solid var(--accent);padding:12px;border-radius:8px;margin:12px 0}.warning{border-left-color:var(--warn)}.video{display:flex;gap:12px;align-items:center;text-decoration:none;background:#273956;border-radius:12px;padding:12px;margin:12px 0}.video .thumb{font-size:28px}.video strong{color:var(--text)}.video span{color:var(--muted)}.history{padding:10px 0;border-bottom:1px solid var(--line)}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar>*{flex:1}label{display:block;color:var(--muted);font-size:13px;margin:10px 0 4px}.danger{background:#572b3b}.status{font-size:12px;color:var(--muted);text-align:right}#error{background:#642b39;color:#fff;padding:12px;border-radius:12px;margin:12px 0;display:none}@media(max-width:400px){.wrap{padding:12px}.grid{grid-template-columns:repeat(3,1fr)}button{padding:9px 8px}}
</style></head><body><main class="wrap"><div class="head"><div class="logo">Lift<b>Log</b> <span class="small muted">v2</span></div><div id="sync" class="status">Local mode</div></div><div id="error"></div><nav class="tabs" id="nav"><button data-page="today" class="active">Today</button><button data-page="history">History</button><button data-page="settings">Settings & Sync</button></nav><section id="today"></section><section id="history" class="hidden"></section><section id="settings" class="hidden"></section></main><script>
'use strict';
const SEED=[];
const TEMPLATES={
'Chest':[['Incline DB press',3,'🏋️'],['Flat DB press',3,'🏋️'],['Incline DB fly',3,'🪽'],['Machine chest fly',3,'⚙️'],['Chest press machine',3,'⚙️']],
'Back':[['Lat pulldown',3,'🏋️'],['Seated cable row',3,'⚙️'],['DB reverse fly',3,'🪽'],['Rear delt machine',3,'⚙️'],['Single-arm DB row',3,'🏋️'],['Machine row',3,'⚙️']],
'Legs & Glutes':[['Goblet squat',3,'🏋️'],['Hip thrust machine',3,'⚙️'],['Reverse lunges',3,'🦵'],['Seated leg curl',3,'⚙️'],['Leg extension',3,'⚙️']],
'Shoulders & Arms':[['DB shoulder press',3,'🏋️'],['DB biceps curl',3,'💪'],['DB lateral raise',3,'🪽'],['DB overhead triceps extension',3,'💪'],['DB hammer curl',3,'💪'],['Cable triceps pushdown',3,'⚙️']]};
const CUES={'Incline DB press':'Bench around 15–30°. Control the descent; keep shoulders stable.','Goblet squat':'Brace your torso and squat through a comfortable range.','Hip thrust machine':'Keep ribs down and pause at the top without arching your back.','Seated cable row':'Keep torso steady and pull elbows toward your hips.','DB lateral raise':'Use light weights; raise under control without swinging.','Reverse lunges':'Step back under control and keep front foot planted.'};
const KEY='liftlog-v2-data'; const CONFIG='liftlog-v2-config';
let data,config={},session=null,page='today',selected='Shoulders & Arms',length='standard',energy='normal',editing=null,workoutDate=new Date().toLocaleDateString('en-CA');
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function alertErr(e){$('error').style.display='block';$('error').textContent='Error: '+(e?.message||e);console.error(e)}
function store(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alertErr('Local storage unavailable. Export your data before closing.')}}
function init(){try{data=JSON.parse(localStorage.getItem(KEY)||'null')||{records:SEED,overrides:{},goals:'Balanced strength and muscle development; progressive overload; no calf raises; avoid Romanian deadlifts. Gym machine resistance varies.'};config=JSON.parse(localStorage.getItem(CONFIG)||'{}'); if(!Array.isArray(data.records))throw Error('Invalid local data');store();bind();render();}catch(e){alertErr(e)}}
function bind(){document.querySelectorAll('#nav button').forEach(b=>b.addEventListener('click',()=>{page=b.dataset.page;editing=null;render()}));}
function latest(name){return data.records.filter(r=>r.exercise.toLowerCase()===name.toLowerCase()).sort((a,b)=>b.date.localeCompare(a.date))[0]}
function fmt(r){return r?`${r.weight||'BW'} × ${r.reps||'?'} (${r.date})`:'No previous log'}
function repsArray(r,n){const arr=(r?.reps||'').split('/').map(x=>parseInt(x,10)).filter(Number.isFinite);return Array.from({length:n},(_,i)=>arr[i]??arr.at(-1)??10)}
function plan(){let t=TEMPLATES[selected].map(([name,sets,icon])=>({name,sets,icon}));if(length==='quick'){t=t.filter(x=>!['Incline DB fly','Chest press machine','DB reverse fly','Machine row','DB overhead triceps extension','DB hammer curl','Leg extension'].includes(x.name)).map(x=>({...x,sets:Math.min(x.sets,2)}));}if(length==='extended'){t=t.map((x,i)=>({...x,sets:i<2?4:x.sets}));}if(energy==='low')t=t.map(x=>({...x,sets:Math.min(x.sets,2)}));return t}
function todayRecord(name){return data.records.filter(r=>r.date===workoutDate&&r.exercise===name).at(-1)}
function render(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));for(const p of ['today','history','settings'])$(p).classList.toggle('hidden',p!==page);if(page==='today')renderToday();if(page==='history')renderHistory();if(page==='settings')renderSettings();$('sync').textContent=session?'Cloud connected':'Local mode • export backups'}
function renderToday(){let s=`<h1>Today's workout</h1><div class="card"><label>Workout date</label><input id="date" type="date" value="${esc(workoutDate)}"><label>Workout type</label><div class="row">${Object.keys(TEMPLATES).map(n=>`<button data-workout="${esc(n)}" class="${selected===n?'active':''}">${esc(n)}</button>`).join('')}</div><label>Workout length</label><div class="grid">${[['quick','⚡ Quick'],['standard','💪 Standard'],['extended','🔥 Extended']].map(([k,v])=>`<button data-length="${k}" class="${length===k?'active':''}">${v}</button>`).join('')}</div><label>Energy</label><div class="grid">${['low','normal','high'].map(k=>`<button data-energy="${k}" class="${energy===k?'active':''}">${k}</button>`).join('')}</div></div>`;
if(editing){const {name,fromHistory}=editing;let r=fromHistory||todayRecord(name)||latest(name);let n=fromHistory?(r.reps||'').split('/').length:(plan().find(x=>x.name===name)?.sets||3);let weights=Array.from({length:n},()=>r?.weight||'');let reps=repsArray(r,n);let base=latest(name);s+=`<div class="card"><button id="back">← Back to workout</button><h2>${esc(name)}</h2><a class="video" target="_blank" rel="noopener noreferrer" href="https://www.youtube.com/results?search_query=${encodeURIComponent(name+' exercise proper form tutorial')}"><span class="thumb">▶️</span><span><strong>Watch form demonstration</strong><br><span class="small">Opens video search • verify equipment variation</span></span></a><div class="note">${esc(CUES[name]||'Move through a controlled range of motion; stop if technique deteriorates.')}</div><p class="muted small">Last recorded: ${esc(fmt(base))}</p><label>Units (as shown at gym)</label><select id="unit"><option value="kg" ${r?.unit==='kg'?'selected':''}>kg</option><option value="lb" ${r?.unit==='lb'?'selected':''}>lb</option><option value="bw" ${r?.unit==='bw'?'selected':''}>Bodyweight</option></select><div id="sets">${weights.map((w,i)=>setHtml(i,w,reps[i])).join('')}</div><button id="addset">+ Add set</button><label>Gym / notes (optional)</label><input id="notes" style="width:100%" placeholder="Gym, machine, technique notes" value="${esc(fromHistory?.notes||'')}"><div class="row" style="margin-top:14px"><button class="primary" id="save">Save exercise</button><button id="cancel">Cancel</button></div></div>`;}else{s+=`<div class="card"><div class="row between"><h2>${esc(selected)}</h2><span class="muted small">${plan().reduce((a,x)=>a+x.sets,0)} planned sets</span></div>${plan().map((x,i)=>{const prev=latest(x.name),now=todayRecord(x.name);return `<button class="exercise" data-exercise="${esc(x.name)}"><span class="badge">${x.icon}</span><span class="grow"><strong>${i+1}. ${esc(x.name)}</strong><br><span class="small muted">${x.sets} sets • ${esc(fmt(prev))}</span></span><span class="${now?'done':''}">${now?'✓':'›'}</span></button>`}).join('')}<p class="small muted">Quick and Extended adjust today's plan only. Already saved sets stay saved.</p></div>`;} $('today').innerHTML=s;
$('date').addEventListener('change',e=>{workoutDate=e.target.value;editing=null;render()});document.querySelectorAll('[data-workout]').forEach(b=>b.onclick=()=>{selected=b.dataset.workout;editing=null;render()});document.querySelectorAll('[data-length]').forEach(b=>b.onclick=()=>{length=b.dataset.length;editing=null;render()});document.querySelectorAll('[data-energy]').forEach(b=>b.onclick=()=>{energy=b.dataset.energy;editing=null;render()});document.querySelectorAll('[data-exercise]').forEach(b=>b.onclick=()=>{editing={name:b.dataset.exercise};render()});
if(editing){$('back').onclick=$('cancel').onclick=()=>{editing=null;render()};$('addset').onclick=()=>{$('sets').insertAdjacentHTML('beforeend',setHtml($('sets').children.length,'',10));wireSets()};$('save').onclick=()=>saveExercise();wireSets()}}
function setHtml(i,w,r){return `<div class="set"><span>${i+1}</span><input class="weight" aria-label="Weight set ${i+1}" value="${esc(w)}" placeholder="Weight"><input class="reps" type="number" min="0" max="300" aria-label="Reps set ${i+1}" value="${esc(r)}"><button class="remove" aria-label="Remove set">×</button></div>`}
function wireSets(){document.querySelectorAll('.remove').forEach(b=>b.onclick=()=>{if($('sets').children.length>1){b.parentNode.remove();[...$('sets').children].forEach((x,i)=>x.firstElementChild.textContent=i+1)}})}
async function saveExercise(){try{const sets=[...document.querySelectorAll('#sets .set')].map(x=>({weight:x.querySelector('.weight').value.trim(),reps:Number(x.querySelector('.reps').value)}));if(sets.some(x=>!Number.isInteger(x.reps)||x.reps<0||x.reps>300))throw Error('Enter valid reps for each set');let weights=[...new Set(sets.map(x=>x.weight))];const old=editing.fromHistory||todayRecord(editing.name);let record={id:old?.id||crypto.randomUUID(),date:old?.date||workoutDate,workout:old?.workout||selected,exercise:editing.name,weight:weights.length===1?weights[0]:sets.map(x=>x.weight).join(' / '),unit:$('unit').value,reps:sets.map(x=>x.reps).join('/'),notes:$('notes').value,sets,source:'liftlog-v2',updated_at:new Date().toISOString()};data.records=data.records.filter(x=>x.id!==record.id);data.records.push(record);store();if(session)await cloudUpsert(record);editing=null;render()}catch(e){alertErr(e)}}
function renderHistory(){let rs=[...data.records].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,250);$('history').innerHTML=`<h1>Training history</h1><p class="muted small">${data.records.length} exercise records • tap to edit</p><div class="card"><div class="toolbar"><button id="jsonExport">Export JSON</button><button id="csvExport">Export CSV</button></div></div><div class="card">${rs.map(r=>`<button class="exercise" data-record="${esc(r.id)}"><span class="grow"><strong>${esc(r.exercise)}</strong><br><span class="small muted">${esc(r.date)} · ${esc(r.weight)} × ${esc(r.reps)}</span></span><span>✎</span></button>`).join('')}</div>`;document.querySelectorAll('[data-record]').forEach(b=>b.onclick=()=>{const r=data.records.find(x=>x.id===b.dataset.record);selected=TEMPLATES[r.workout]?r.workout:'Chest';workoutDate=r.date;editing={name:r.exercise,fromHistory:r};page='today';render()});$('jsonExport').onclick=()=>download('liftlog-backup.json',JSON.stringify(data,null,2),'application/json');$('csvExport').onclick=()=>download('liftlog-history.csv',['date,workout,exercise,weight,unit,reps,notes',...data.records.map(r=>[r.date,r.workout,r.exercise,r.weight,r.unit,r.reps,r.notes].map(v=>'"'+String(v||'').replaceAll('"','""')+'"').join(','))].join('\n'),'text/csv')}
function download(name,content,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([content],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),500)}
function renderSettings(){$('settings').innerHTML=`<h1>Settings & Sync</h1><div class="card"><h2>Training profile</h2><textarea id="goals" style="width:100%;height:120px;background:#101b2e;color:white;border-radius:10px;padding:10px">${esc(data.goals)}</textarea><button id="saveGoals">Save profile</button></div><div class="card"><h2>Backups</h2><p class="small muted">Export regularly. Browser storage can be cleared. Import replaces current local records.</p><div class="row"><button id="backup">Download backup</button><input id="restore" type="file" accept="application/json,.json"></div></div><div class="card"><h2>Cloud connection (Supabase)</h2><p class="small muted">Optional. Requires running the included SQL and creating an account in your own Supabase project. Never paste a service-role key here.</p><label>Project URL</label><input id="url" style="width:100%" placeholder="https://PROJECT.supabase.co" value="${esc(config.url||'')}"><label>Publishable / anon key</label><input id="key" style="width:100%" value="${esc(config.key||'')}"><label>Email</label><input id="email" type="email" style="width:100%" value="${esc(config.email||'')}"><label>Password</label><input id="password" type="password" style="width:100%"><div class="row" style="margin-top:12px"><button id="connect">Sign in</button><button id="signup">Sign up</button><button id="upload">Upload local history</button><button id="pull">Pull cloud history</button></div><p id="cloudmsg" class="small muted">${session?'Connected':'Not connected'}</p></div><div class="card"><h2>ChatGPT integration</h2><p class="small muted">The app stores structured records ready for a secure MCP/API integration. ChatGPT read/write access is NOT active until that integration is deployed and authorized.</p></div>`;
$('saveGoals').onclick=()=>{data.goals=$('goals').value;store();alert('Training profile saved')};$('backup').onclick=()=>download('liftlog-backup.json',JSON.stringify(data,null,2),'application/json');$('restore').onchange=async e=>{try{let j=JSON.parse(await e.target.files[0].text());if(!Array.isArray(j.records))throw Error('Not a LiftLog backup');if(confirm('Replace local history with this backup?')){data=j;store();render()}}catch(e){alertErr(e)}};for(const id of ['connect','signup','upload','pull'])$(id).onclick=async()=>{try{config={url:$('url').value.trim().replace(/\/$/,''),key:$('key').value.trim(),email:$('email').value.trim()};localStorage.setItem(CONFIG,JSON.stringify(config));if(id==='connect'||id==='signup')await auth(id==='signup',$('password').value);if(id==='upload')await pushAll();if(id==='pull')await pullAll();$('cloudmsg').textContent=id+' succeeded';render()}catch(e){$('cloudmsg').textContent='Error: '+e.message;alertErr(e)}}}
async function auth(signup,password){if(!config.url.startsWith('https://')||!config.key||!config.email||!password)throw Error('Provide Supabase URL, publishable key, email and password');const endpoint=signup?'signup':'token?grant_type=password';const r=await fetch(config.url+'/auth/v1/'+endpoint,{method:'POST',headers:{'Content-Type':'application/json',apikey:config.key},body:JSON.stringify({email:config.email,password})});const j=await r.json();if(!r.ok)throw Error(j.msg||j.error_description||j.message||'Authentication failed');if(!j.access_token)throw Error('Check email to confirm account, then sign in');session=j;sessionStorage.setItem('liftlog-token',JSON.stringify(session))}
async function api(path,method='GET',body){if(!session){session=JSON.parse(sessionStorage.getItem('liftlog-token')||'null')}if(!session)throw Error('Sign in first');let r=await fetch(config.url+'/rest/v1/'+path,{method,headers:{apikey:config.key,Authorization:'Bearer '+session.access_token,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=representation'},body:body?JSON.stringify(body):undefined});if(!r.ok)throw Error('Cloud '+r.status+': '+(await r.text()).slice(0,300));return r.json()}
async function cloudUpsert(record){const user=JSON.parse(atob(session.access_token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).sub;await api('workout_records?on_conflict=user_id,id','POST',[{user_id:user,id:record.id,payload:record,updated_at:record.updated_at||new Date().toISOString()}])}
async function pushAll(){if(!session)throw Error('Sign in first');for(const r of data.records)await cloudUpsert(r)}
async function pullAll(){let cloud=await api('workout_records?select=id,payload,updated_at&limit=1000');let map=new Map(data.records.map(r=>[r.id,r]));for(const x of cloud){const local=map.get(x.id);if(!local||String(x.updated_at||'')>String(local.updated_at||''))map.set(x.id,x.payload)}data.records=[...map.values()];store()}
window.addEventListener('error',e=>alertErr(e.error||e.message));window.addEventListener('unhandledrejection',e=>alertErr(e.reason));init();
</script></body></html>
