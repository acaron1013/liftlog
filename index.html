<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080808"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>LiftLog • Training v4.3</title><style>
:root{color-scheme:dark;--bg:#07080b;--panel:#14151b;--line:#323440;--text:#f8f9ff;--muted:#a3a5b5;--accent:#c7ff36;--warn:#ffbd6a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,sans-serif}button,input,select{font:inherit}button{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#24252d;color:var(--text);cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--accent)}button.active,.primary{background:var(--accent);color:#101309;font-weight:750;border-color:var(--accent)}button:disabled{opacity:.45}input,select{background:#101115;border:1px solid var(--line);border-radius:10px;color:var(--text);padding:10px;min-width:0}input[type=number]{width:100%}a{color:var(--accent)}.wrap{max-width:780px;margin:auto;padding:16px}.head{display:flex;justify-content:space-between;align-items:center;gap:8px}.logo{font-size:25px;font-weight:850}.logo b{color:var(--accent)}.muted{color:var(--muted)}.small{font-size:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pill{padding:8px 10px}.exercise{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin:8px 0;padding:14px}.exercise .badge{width:42px;height:42px;display:grid;place-items:center;background:#292c35;border-radius:12px;font-size:22px}.grow{flex:1}.done{color:var(--accent)}h1{font-size:23px;margin:12px 0 4px}h2{font-size:18px;margin:0 0 12px}.hidden{display:none!important}.stack{display:grid;gap:8px}.set{display:grid;grid-template-columns:30px 1fr 1fr 32px;gap:8px;align-items:center;margin:7px 0}.set button{padding:9px 0}.tabs{display:flex;gap:7px;overflow-x:auto;margin:14px 0}.tabs button{white-space:nowrap}.note{background:#22252d;border-left:3px solid var(--accent);padding:12px;border-radius:8px;margin:12px 0}.warning{border-left-color:var(--warn)}.video{display:flex;gap:12px;align-items:center;text-decoration:none;background:#22252d;border-radius:12px;padding:12px;margin:12px 0}.video .thumb{font-size:28px}.video strong{color:var(--text)}.video span{color:var(--muted)}.history{padding:10px 0;border-bottom:1px solid var(--line)}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar>*{flex:1}label{display:block;color:var(--muted);font-size:13px;margin:10px 0 4px}.danger{background:#572b3b}.status{font-size:12px;color:var(--muted);text-align:right}#error{background:#642b39;color:#fff;padding:12px;border-radius:12px;margin:12px 0;display:none}@media(max-width:400px){.wrap{padding:12px}.grid{grid-template-columns:repeat(3,1fr)}button{padding:9px 8px}}

.exercise-thumb{width:80px;height:88px;object-fit:cover;border-radius:12px;flex-shrink:0;border:1px solid #454852}.exercise-hero{display:block;width:100%;height:220px;object-fit:contain;background:#1b1d24;border:1px solid #41444f;border-radius:16px;margin:12px 0}.exercise{min-height:106px;background:#1c1d25}.exercise:hover{border-color:var(--accent)}.next-target{color:var(--accent);font-size:12px}.progression{border-left-color:#c7ff36}.calendar-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.calendar-head button{font-size:24px;min-width:48px}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.weekday{text-align:center;color:var(--muted);font-size:11px}.day{min-height:52px;padding:6px 2px;display:flex;align-items:center;flex-direction:column;gap:4px;background:#1c1d25}.day.trained{border-color:#7e9c2e}.day-dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}.day.active{background:var(--accent);color:#111}.day.active .day-dot{background:#111}@media(max-width:400px){.exercise-thumb{width:64px;height:74px}.calendar{gap:3px}.day{min-height:47px}}
.day.rest-day{border-color:#719fe8}.rest-dot{width:8px;height:8px;border-radius:50%;background:#719fe8}.day.active .rest-dot{background:#111}.day{min-height:66px!important;padding:5px 1px!important}.cal-badges{display:flex;flex-direction:column;align-items:center;gap:2px;width:100%}.cal-tag{display:inline-block;border-radius:5px;padding:2px 3px;font-size:9px;line-height:1.2;font-weight:800;letter-spacing:.1px;white-space:nowrap;color:#0c0e11}.cal-back{background:#63c8ff}.cal-legs{background:#ffad66}.cal-arms{background:#c8a1ff}.cal-chest{background:#c7ff36}.cal-rest{background:#7f9fcb}.cal-other{background:#e0e0e0}.calendar-legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.day.active .cal-tag{outline:1px solid #fff}@media(max-width:400px){.cal-tag{font-size:8px;padding:2px}.day{min-height:64px!important}}</style></head><body><main class="wrap"><div class="head"><div class="logo">Lift<b>Log</b> <span class="small muted">v4.3 • Exercise Illustrations</span></div><div id="sync" class="status">Local mode</div></div><div id="error"></div><nav class="tabs" id="nav"><button data-page="today" class="active">Today</button><button data-page="history">History</button><button data-page="settings">Settings & Sync</button></nav><section id="today"></section><section id="history" class="hidden"></section><section id="settings" class="hidden"></section></main><script>
'use strict';
const SEED=[];
const TEMPLATES={
'Chest':[['Incline DB press',3,'🏋️'],['Flat DB press',3,'🏋️'],['Incline DB fly',3,'🪽'],['Machine chest fly',3,'⚙️'],['Chest press machine',3,'⚙️']],
'Back':[['Lat pulldown',3,'🏋️'],['Seated cable row',3,'⚙️'],['DB reverse fly',3,'🪽'],['Rear delt machine',3,'⚙️'],['Single-arm DB row',3,'🏋️'],['Machine row',3,'⚙️']],
'Legs & Glutes':[['Goblet squat',3,'🏋️'],['Hip thrust machine',3,'⚙️'],['Reverse lunges',3,'🦵'],['Seated leg curl',3,'⚙️'],['Leg extension',3,'⚙️']],
'Shoulders & Arms':[['DB shoulder press',3,'🏋️'],['DB biceps curl',3,'💪'],['DB lateral raise',3,'🪽'],['DB overhead triceps extension',3,'💪'],['DB hammer curl',3,'💪'],['Cable triceps pushdown',3,'⚙️']]};
const CUES={'Incline DB press':'Bench around 15–30°. Control the descent; keep shoulders stable.','Goblet squat':'Brace your torso and squat through a comfortable range.','Hip thrust machine':'Keep ribs down and pause at the top without arching your back.','Seated cable row':'Keep torso steady and pull elbows toward your hips.','DB lateral raise':'Use light weights; raise under control without swinging.','Reverse lunges':'Step back under control and keep front foot planted.'};
const KEY='liftlog-v2-data'; const CONFIG='liftlog-v2-config';
const CYCLE=['Back','Legs & Glutes','Shoulders & Arms','Chest'];
let calendarMonth=new Date().toISOString().slice(0,7),historyDay=null;let data,config={},session=null,page='today',selected='Shoulders & Arms',length='standard',editing=null,workoutDate=new Date().toLocaleDateString('en-CA');
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function alertErr(e){$('error').style.display='block';$('error').textContent='Error: '+(e?.message||e);console.error(e)}
function restDays(){if(!data||!Array.isArray(data.restDays))data.restDays=[];return data.restDays}
function store(){restDays();try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alertErr('Local storage unavailable. Export your data before closing.')}}
function init(){try{data=JSON.parse(localStorage.getItem(KEY)||'null')||{records:SEED,overrides:{},goals:'Balanced strength and muscle development; progressive overload; no calf raises; avoid Romanian deadlifts. Gym machine resistance varies.'};config=JSON.parse(localStorage.getItem(CONFIG)||'{}'); if(!Array.isArray(data.records))throw Error('Invalid local data');if(!Array.isArray(data.restDays))data.restDays=[];selected=recommendation().workout;store();bind();render();}catch(e){alertErr(e)}}
function bind(){document.querySelectorAll('#nav button').forEach(b=>b.addEventListener('click',()=>{page=b.dataset.page;editing=null;render()}));}
function latest(name){return data.records.filter(r=>r.exercise.toLowerCase()===name.toLowerCase()).sort((a,b)=>b.date.localeCompare(a.date))[0]}
function fmt(r){return r?`${r.weight||'BW'} × ${r.reps||'?'} (${r.date})`:'No previous log'}
function repsArray(r,n){const arr=(r?.reps||'').split('/').map(x=>parseInt(x,10)).filter(Number.isFinite);return Array.from({length:n},(_,i)=>arr[i]??arr.at(-1)??10)}

function art(name,large=false){
 // Each exercise has its own pose, apparatus, and motion direction.
 const n=name.toLowerCase();
 const defs={
 'incline db press':['incline','press','DUMBBELLS'], 'flat db press':['bench','press','DUMBBELLS'],
 'incline db fly':['incline','fly','DUMBBELLS'], 'machine chest fly':['pecdeck','fly','PEC DECK'],
 'chest press machine':['pressmachine','press','PRESS MACHINE'], 'lat pulldown':['pulldown','pull','LAT BAR'],
 'seated cable row':['cablerow','row','CABLE ROW'], 'db reverse fly':['hinge','fly','DUMBBELLS'],
 'rear delt machine':['pecdeck','rear','REVERSE PEC DECK'], 'single-arm db row':['onearm','row','DUMBBELL'],
 'machine row':['rowmachine','row','ROW MACHINE'], 'goblet squat':['squat','squat','GOBLET DUMBBELL'],
 'hip thrust machine':['hipthrust','thrust','HIP THRUST MACHINE'], 'reverse lunges':['lunge','lunge','BODYWEIGHT'],
 'seated leg curl':['legcurl','curl','LEG CURL MACHINE'], 'leg extension':['legext','extend','LEG EXTENSION'],
 'db shoulder press':['standing','overhead','DUMBBELLS'], 'db biceps curl':['standing','biceps','DUMBBELLS'],
 'db lateral raise':['standing','lateral','DUMBBELLS'], 'db overhead triceps extension':['standing','triceps','DUMBBELL'],
 'db hammer curl':['standing','hammer','DUMBBELLS'], 'cable triceps pushdown':['cable','pushdown','CABLE MACHINE']};
 const [equip,motion,caption]=defs[n]||['standing','biceps','EXERCISE'];
 const line=(d,c='#e4ebf2',w=8)=>`<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
 const weight=(x,y)=>`<g stroke="#c7ff36" stroke-width="5"><path d="M${x-12} ${y}h24"/><path d="M${x-9} ${y-10}v20M${x+9} ${y-10}v20"/></g>`;
 const base=`<rect width="240" height="200" rx="16" fill="#181e29"/><path d="M14 164H226" stroke="#3b4655" stroke-width="3"/>`;
 let equipment='',body='',arms='',extra='';
 const upright=()=>{body=`<circle cx="120" cy="43" r="13" fill="#f3b38e"/>${line('M120 59V114 M120 114L100 158 M120 114L140 158','#75a9e9',10)}`};
 const seated=()=>{body=`<circle cx="120" cy="49" r="12" fill="#f3b38e"/>${line('M120 64V112 M120 112L145 126L158 158 M120 112L105 129L98 158','#75a9e9',10)}`;equipment+=line('M100 115H162M107 115V162','#677485',5)};
 if(['standing','cable','pulldown'].includes(equip))upright();
 else if(['legcurl','legext','pecdeck','pressmachine','rowmachine','cablerow'].includes(equip))seated();
 else if(['bench','incline','hipthrust'].includes(equip)){
  const slant=equip==='incline';equipment+=line(slant?'M55 128L122 84M122 84L160 112':'M50 124H165','#677485',9)+line('M70 128V163M160 128V163','#677485',5);
  body=`<circle cx="${slant?112:80}" cy="${slant?80:103}" r="12" fill="#f3b38e"/>${line(slant?'M123 90L159 121L179 132 M159 121L157 157':'M92 105L153 107L182 129 M153 107L148 156','#75a9e9',10)}`;
 }else if(equip==='hinge'||equip==='onearm'){
  body=`<circle cx="92" cy="62" r="13" fill="#f3b38e"/>${line('M103 74L142 100 M142 100L134 157 M142 100L170 156','#75a9e9',10)}`;
  if(equip==='onearm')equipment+=line('M64 113H112M70 113V160','#677485',6);
 }else if(equip==='squat'||equip==='lunge'){
  body=`<circle cx="120" cy="40" r="13" fill="#f3b38e"/>${line(equip==='squat'?'M120 55V105 M120 105L86 126L109 157 M120 105L155 125L137 157':'M120 55V105 M120 105L85 132L60 157 M120 105L150 129L180 157','#75a9e9',10)}`;
 }
 if(['press','fly'].includes(motion)){
  arms=line(motion==='press'?'M118 86L97 66L97 28 M132 86L153 66L153 28':'M118 88L77 78L53 57 M132 88L173 78L197 57','#f3b38e',8);
  extra=motion==='press'?weight(97,25)+weight(153,25):weight(53,57)+weight(197,57);
 }else if(motion==='overhead'){
  arms=line('M115 72L91 55L91 20 M125 72L149 55L149 20','#f3b38e',8);extra=weight(91,20)+weight(149,20);
 }else if(['biceps','hammer'].includes(motion)){
  arms=line('M116 78L92 107L86 80 M124 78L148 107L154 80','#f3b38e',8);extra=weight(86,80)+weight(154,80);
 }else if(motion==='lateral'){
  arms=line('M115 78L76 71L40 72 M125 78L164 71L200 72','#f3b38e',8);extra=weight(40,72)+weight(200,72);
 }else if(motion==='triceps'){
  arms=line('M116 75L105 42L117 17 M124 75L135 42L123 17','#f3b38e',8);extra=weight(120,17);
 }else if(motion==='pushdown'){
  arms=line('M115 76L94 102L90 133 M125 76L146 102L150 133','#f3b38e',8);
 }else if(['pull','row','rear'].includes(motion)){
  arms=line(motion==='pull'?'M115 78L91 58L79 35 M125 78L149 58L161 35':motion==='rear'?'M115 77L75 76L48 52 M125 77L165 76L192 52':'M115 82L88 99L63 87 M125 82L152 99L177 87','#f3b38e',8);
  if(equip==='onearm'||equip==='hinge')extra=weight(63,87)+weight(177,87);
 }else if(motion==='squat'){arms=line('M115 74L101 92L119 99 M125 74L139 92L121 99','#f3b38e',8);extra=weight(120,99)}
 else if(motion==='lunge'){arms=line('M116 78L103 115 M124 78L137 115','#f3b38e',8)}
 else if(motion==='thrust'){arms=line('M110 100L83 127 M132 101L160 128','#f3b38e',8);extra=weight(125,98)}
 else if(motion==='curl'||motion==='extend'){arms=line('M112 78L90 108 M128 78L150 108','#f3b38e',8);extra=line(motion==='extend'?'M145 130L188 120':'M145 130L185 149','#c7ff36',7)};
 if(['cable','pulldown','cablerow'].includes(equip))equipment+=line('M205 20V162 M205 20H160','#667585',5)+line(equip==='pulldown'?'M79 35H161 M161 35L205 20':equip==='cable'?'M90 133H150 M150 133L205 20':'M177 87L205 20','#c7ff36',4);
 if(['legcurl','legext'].includes(equip))equipment+=line(equip==='legext'?'M158 153H203M203 140V163':'M145 155L192 150','#c7ff36',7);
 if(equip==='pecdeck'||equip==='pressmachine'||equip==='rowmachine')equipment+=line('M190 53V161M190 53H163','#667585',5);
 const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 240 240">${base}${equipment}${body}${arms}${extra}<rect y="185" width="240" height="55" fill="#11151d"/><text x="120" y="205" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#c7ff36">${caption}</text><text x="120" y="224" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#e4ebf2">${name.replace(/&/g,'&amp;')}</text></svg>`;
 return `<img class="${large?'exercise-hero':'exercise-thumb'}" src="data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}" alt="${esc(name)} exercise-specific illustration">`;
}
function workoutStyle(workout){
 const w=String(workout||'').toLowerCase();
 if(w.includes('back'))return {label:'BACK',cls:'cal-back'};
 if(w.includes('leg')||w.includes('glute'))return {label:'LEGS',cls:'cal-legs'};
 if(w.includes('shoulder')||w.includes('arm'))return {label:'ARMS',cls:'cal-arms'};
 if(w.includes('chest'))return {label:'CHEST',cls:'cal-chest'};
 return {label:'LIFT',cls:'cal-other'};
}

function rule(name){const n=name.toLowerCase();if(/lateral raise|reverse fly|rear delt|fly|curl|pushdown|extension/.test(n))return {min:10,max:15};if(/lunge/.test(n))return {min:10,max:16};return {min:8,max:12}}
function progression(r,n){const ruleSet=rule(r?.exercise||editing?.name||'');if(!r||!r.reps)return {weight:'',reps:Array(n).fill(ruleSet.min),label:`Start at ${ruleSet.min} reps with a manageable weight. Range ${ruleSet.min}–${ruleSet.max}.`};const reps=repsArray(r,n),unit=r.unit||'kg',weight=r.weight||'',numeric=Number(weight);const hasWeight=Number.isFinite(numeric)&&numeric>0&&String(weight).trim()!=='';const ceiling=reps.length>=n&&reps.slice(0,n).every(x=>x>=ruleSet.max);
 if(ceiling&&hasWeight){const dumbbell=/DB |dumbbell|goblet/i.test(r.exercise);const inc=unit==='lb'?(dumbbell?5:5):(dumbbell?2.5:2.5);const next=+(numeric+inc).toFixed(2);return {weight:String(next),reps:Array(n).fill(ruleSet.min),label:`Increase weight: ${weight} → ${next} ${unit}; aim for ${ruleSet.min} reps/set. Confirm good form and that this increment is available.`,increase:true}}
 const target=reps.map(x=>Math.min(ruleSet.max,x+1));return {weight,reps:target,label:`Next: ${weight||'Bodyweight'} ${unit==='bw'?'':unit} × ${target.join('/')} reps. Range ${ruleSet.min}–${ruleSet.max}; increase weight after all sets reach ${ruleSet.max} with good form.`}}
function dayWorkouts(){const m=new Map();for(const r of data.records){if(!CYCLE.includes(r.workout))continue;const d=m.get(r.date)||new Map();d.set(r.workout,(d.get(r.workout)||0)+1);m.set(r.date,d)}return [...m.entries()].sort((a,b)=>a[0].localeCompare(b[0])).map(([date,types])=>({date,workout:[...types].sort((a,b)=>b[1]-a[1])[0][0]}))}
function recommendation(){const workouts=dayWorkouts().filter(x=>x.date<workoutDate);const today=dayWorkouts().find(x=>x.date===workoutDate);const last=workouts.at(-1);const workout=today?.workout||(last?CYCLE[(CYCLE.indexOf(last.workout)+1)%CYCLE.length]:'Back');const trained=new Set(workouts.map(x=>x.date));let consecutive=0;let d=new Date(workoutDate+'T12:00:00');d.setDate(d.getDate()-1);for(let i=0;i<60;i++){const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');if(!trained.has(k))break;consecutive++;d.setDate(d.getDate()-1)}return {workout,last,consecutive,rest:consecutive>=4}}
function logRest(){if(data.records.some(r=>r.date===workoutDate)){alert('This date already contains lifting records. Remove those before logging a lifting rest day.');return}if(!restDays().includes(workoutDate))restDays().push(workoutDate);store();render()}
function undoRest(){data.restDays=restDays().filter(d=>d!==workoutDate);store();render()}

function plan(){let t=TEMPLATES[selected].map(([name,sets,icon])=>({name,sets,icon}));if(length==='quick'){t=t.filter(x=>!['Incline DB fly','Chest press machine','DB reverse fly','Machine row','DB overhead triceps extension','DB hammer curl','Leg extension'].includes(x.name)).map(x=>({...x,sets:Math.min(x.sets,2)}));}if(length==='extended'){t=t.map((x,i)=>({...x,sets:i<2?4:x.sets}));}return t}
function todayRecord(name){return data.records.filter(r=>r.date===workoutDate&&r.exercise===name).at(-1)}
function render(){restDays();document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));for(const p of ['today','history','settings'])$(p).classList.toggle('hidden',p!==page);if(page==='today')renderToday();if(page==='history')renderHistory();if(page==='settings')renderSettings();$('sync').textContent=session?'Cloud connected':'Local mode • export backups'}
function renderToday(){let rec=recommendation(),restLogged=restDays().includes(workoutDate);let s=`<h1>Today's workout</h1><div class="card"><label>Workout date</label><input id="date" type="date" value="${esc(workoutDate)}"><label>Workout type</label><div class="row">${Object.keys(TEMPLATES).map(n=>`<button data-workout="${esc(n)}" class="${selected===n?'active':''}">${esc(n)}</button>`).join('')}</div><label>Workout length</label><div class="grid">${[['quick','⚡ Quick'],['standard','💪 Standard'],['extended','🔥 Extended']].map(([k,v])=>`<button data-length="${k}" class="${length===k?'active':''}">${v}</button>`).join('')}</div></div>`;
s+=`<div class="card" style="border-color:${rec.rest?'#719fe8':'var(--accent)'}"><span class="small muted">TODAY’S RECOMMENDATION</span><h2 style="margin:7px 0">${restLogged?'💤 Lifting rest day logged':rec.rest?'💤 Rest from lifting recommended':'💪 '+esc(rec.workout)}</h2><p class="muted small">${rec.rest?'You have lifted '+rec.consecutive+' consecutive days. Your next workout remains '+rec.workout+'.':'Next in your cycle: '+rec.workout+'.'} ${rec.last?'Last: '+rec.last.workout+' ('+rec.last.date+').':'No prior cycle workout found.'}</p><div class="row"><button class="primary" id="useRecommended">${rec.rest?'Lift anyway: ':'Use recommended: '}${esc(rec.workout)}</button>${restLogged?'<button id="undoRest">Undo rest day</button>':'<button id="logRest">💤 Log lifting rest day</button>'}</div><p class="small muted">Rest means no lifting only. It does not advance your rotation.</p></div>`;
if(editing){const {name,fromHistory}=editing;let r=fromHistory||todayRecord(name)||latest(name);let n=fromHistory?(r.reps||'').split('/').length:(plan().find(x=>x.name===name)?.sets||3);let base=latest(name);let next=progression(base||{exercise:name},n);let weights=Array.from({length:n},()=>fromHistory||todayRecord(name)?r?.weight||'':next.weight);let reps=fromHistory||todayRecord(name)?repsArray(r,n):next.reps;s+=`<div class="card"><button id="back">← Back to workout</button><h2>${esc(name)}</h2>${art(name,true)}<div class="note progression">${esc(next.label)}</div><a class="video" target="_blank" rel="noopener noreferrer" href="https://www.youtube.com/results?search_query=${encodeURIComponent(name+' exercise proper form tutorial')}"><span class="thumb">▶️</span><span><strong>Watch form demonstration</strong><br><span class="small">Opens video search • verify equipment variation</span></span></a><div class="note">${esc(CUES[name]||'Move through a controlled range of motion; stop if technique deteriorates.')}</div><p class="muted small">Last recorded: ${esc(fmt(base))}</p><label>Units (as shown at gym)</label><select id="unit"><option value="kg" ${r?.unit==='kg'?'selected':''}>kg</option><option value="lb" ${r?.unit==='lb'?'selected':''}>lb</option><option value="bw" ${r?.unit==='bw'?'selected':''}>Bodyweight</option></select><div id="sets">${weights.map((w,i)=>setHtml(i,w,reps[i])).join('')}</div><button id="addset">+ Add set</button><label>Gym / notes (optional)</label><input id="notes" style="width:100%" placeholder="Gym, machine, technique notes" value="${esc(fromHistory?.notes||'')}"><div class="row" style="margin-top:14px"><button class="primary" id="save">Save exercise</button><button id="cancel">Cancel</button></div></div>`;}else{s+=`<div class="card"><div class="row between"><h2>${esc(selected)}</h2><span class="muted small">${plan().reduce((a,x)=>a+x.sets,0)} planned sets</span></div>${plan().map((x,i)=>{const prev=latest(x.name),now=todayRecord(x.name);return `<button class="exercise" data-exercise="${esc(x.name)}">${art(x.name)}<span class="grow"><strong>${i+1}. ${esc(x.name)}</strong><br><span class="small muted">${x.sets} sets • ${esc(fmt(prev))}<br><span class="next-target">${esc(progression(prev||{exercise:x.name},x.sets).label)}</span></span></span><span class="${now?'done':''}">${now?'✓':'›'}</span></button>`}).join('')}<p class="small muted">Quick and Extended adjust today's plan only. Already saved sets stay saved.</p></div>`;} $('today').innerHTML=s;
$('useRecommended').onclick=()=>{selected=recommendation().workout;editing=null;render()};if($('logRest'))$('logRest').onclick=logRest;if($('undoRest'))$('undoRest').onclick=undoRest;
$('date').addEventListener('change',e=>{workoutDate=e.target.value;editing=null;render()});document.querySelectorAll('[data-workout]').forEach(b=>b.onclick=()=>{selected=b.dataset.workout;editing=null;render()});document.querySelectorAll('[data-length]').forEach(b=>b.onclick=()=>{length=b.dataset.length;editing=null;render()});document.querySelectorAll('[data-exercise]').forEach(b=>b.onclick=()=>{editing={name:b.dataset.exercise};render()});
if(editing){$('back').onclick=$('cancel').onclick=()=>{editing=null;render()};$('addset').onclick=()=>{$('sets').insertAdjacentHTML('beforeend',setHtml($('sets').children.length,'',10));wireSets()};$('save').onclick=()=>saveExercise();wireSets()}}
function setHtml(i,w,r){return `<div class="set"><span>${i+1}</span><input class="weight" aria-label="Weight set ${i+1}" value="${esc(w)}" placeholder="Weight"><input class="reps" type="number" min="0" max="300" aria-label="Reps set ${i+1}" value="${esc(r)}"><button class="remove" aria-label="Remove set">×</button></div>`}
function wireSets(){document.querySelectorAll('.remove').forEach(b=>b.onclick=()=>{if($('sets').children.length>1){b.parentNode.remove();[...$('sets').children].forEach((x,i)=>x.firstElementChild.textContent=i+1)}})}
async function saveExercise(){try{const sets=[...document.querySelectorAll('#sets .set')].map(x=>({weight:x.querySelector('.weight').value.trim(),reps:Number(x.querySelector('.reps').value)}));if(sets.some(x=>!Number.isInteger(x.reps)||x.reps<0||x.reps>300))throw Error('Enter valid reps for each set');let weights=[...new Set(sets.map(x=>x.weight))];const old=editing.fromHistory||todayRecord(editing.name);let record={id:old?.id||crypto.randomUUID(),date:old?.date||workoutDate,workout:old?.workout||selected,exercise:editing.name,weight:weights.length===1?weights[0]:sets.map(x=>x.weight).join(' / '),unit:$('unit').value,reps:sets.map(x=>x.reps).join('/'),notes:$('notes').value,sets,source:'liftlog-v2',updated_at:new Date().toISOString()};data.records=data.records.filter(x=>x.id!==record.id);data.records.push(record);data.restDays=restDays().filter(d=>d!==record.date);store();if(session)await cloudUpsert(record);editing=null;render()}catch(e){alertErr(e)}}
function renderHistory(){
 const [year,month]=calendarMonth.split('-').map(Number),first=new Date(year,month-1,1).getDay(),days=new Date(year,month,0).getDate();
 const byDate=new Map();for(const r of data.records){if(!byDate.has(r.date))byDate.set(r.date,[]);byDate.get(r.date).push(r)}
 const title=new Date(year,month-1,1).toLocaleDateString('en-US',{month:'long',year:'numeric'});
 const calendar=Array.from({length:first},()=>'<span></span>').concat(Array.from({length:days},(_,i)=>{
  const d=`${calendarMonth}-${String(i+1).padStart(2,'0')}`,rs=byDate.get(d)||[],rest=restDays().includes(d);
  const kinds=[...new Set(rs.map(r=>r.workout).filter(Boolean))].map(workoutStyle);
  const badges=kinds.length?`<span class="cal-badges">${kinds.map(k=>`<span class="cal-tag ${k.cls}">${k.label}</span>`).join('')}</span>`:rest?'<span class="cal-badges"><span class="cal-tag cal-rest">REST</span></span>':'';
  return `<button class="day ${rs.length?'trained':''} ${rest?'rest-day':''} ${historyDay===d?'active':''}" data-day="${d}" aria-label="${d}: ${kinds.map(k=>k.label).join(', ')|| (rest?'Rest from lifting':'No workout')}"><strong>${i+1}</strong>${badges}</button>`
 })).join('');
 const rs=byDate.get(historyDay)||[];const workouts=[...new Set(rs.map(r=>r.workout))];
 $('history').innerHTML=`<h1>Training calendar</h1><p class="muted small">${data.records.length} exercise records • ${restDays().length} lifting rest days • select a date</p><div class="card"><div class="calendar-head"><button id="prevMonth" aria-label="Previous month">‹</button><strong>${title}</strong><button id="nextMonth" aria-label="Next month">›</button></div><div class="calendar">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<span class="weekday">${x}</span>`).join('')}${calendar}</div><div class="calendar-legend"><span class="cal-tag cal-back">BACK</span><span class="cal-tag cal-legs">LEGS</span><span class="cal-tag cal-arms">ARMS</span><span class="cal-tag cal-chest">CHEST</span><span class="cal-tag cal-rest">REST</span></div></div><div class="card"><h2>${historyDay?new Date(historyDay+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}):'Select a day'}</h2>${rs.length?`<p class="muted">${esc(workouts.join(' · '))} • ${rs.length} exercises</p>${rs.map(r=>`<button class="exercise" data-record="${esc(r.id)}">${art(r.exercise)}<span class="grow"><strong>${esc(r.exercise)}</strong><br><span class="small muted">${esc(r.weight)} ${esc(r.unit)} × ${esc(r.reps)}</span></span><span>✎</span></button>`).join('')}`:(historyDay&&restDays().includes(historyDay)?'<p class="muted">💤 Rest from lifting logged.</p>':'<p class="muted">No workout recorded for this date.</p>')}</div><div class="card"><div class="toolbar"><button id="jsonExport">Export JSON</button><button id="csvExport">Export CSV</button></div></div>`;
 $('prevMonth').onclick=()=>{calendarMonth=new Date(year,month-2,1).toISOString().slice(0,7);historyDay=null;render()};
 $('nextMonth').onclick=()=>{calendarMonth=new Date(year,month,1).toISOString().slice(0,7);historyDay=null;render()};
 document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{historyDay=b.dataset.day;render()});
 document.querySelectorAll('[data-record]').forEach(b=>b.onclick=()=>{const r=data.records.find(x=>x.id===b.dataset.record);selected=TEMPLATES[r.workout]?r.workout:'Chest';workoutDate=r.date;editing={name:r.exercise,fromHistory:r};page='today';render()});
 $('jsonExport').onclick=()=>download('liftlog-backup.json',JSON.stringify(data,null,2),'application/json');
 $('csvExport').onclick=()=>download('liftlog-history.csv',['date,workout,exercise,weight,unit,reps,notes',...data.records.map(r=>[r.date,r.workout,r.exercise,r.weight,r.unit,r.reps,r.notes].map(v=>'"'+String(v||'').replaceAll('"','""')+'"').join(','))].join('\n'),'text/csv')
}
function download(name,content,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([content],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),500)}
function renderSettings(){$('settings').innerHTML=`<h1>Settings & Sync</h1><div class="card"><h2>Training profile</h2><textarea id="goals" style="width:100%;height:120px;background:#101115;color:white;border-radius:10px;padding:10px">${esc(data.goals)}</textarea><button id="saveGoals">Save profile</button></div><div class="card"><h2>Backups</h2><p class="small muted">Export regularly. Browser storage can be cleared. Import replaces current local records.</p><div class="row"><button id="backup">Download backup</button><input id="restore" type="file" accept="application/json,.json"></div></div><div class="card"><h2>Cloud connection (Supabase)</h2><p class="small muted">Optional. Requires running the included SQL and creating an account in your own Supabase project. Never paste a service-role key here.</p><label>Project URL</label><input id="url" style="width:100%" placeholder="https://PROJECT.supabase.co" value="${esc(config.url||'')}"><label>Publishable / anon key</label><input id="key" style="width:100%" value="${esc(config.key||'')}"><label>Email</label><input id="email" type="email" style="width:100%" value="${esc(config.email||'')}"><label>Password</label><input id="password" type="password" style="width:100%"><div class="row" style="margin-top:12px"><button id="connect">Sign in</button><button id="signup">Sign up</button><button id="upload">Upload local history</button><button id="pull">Pull cloud history</button></div><p id="cloudmsg" class="small muted">${session?'Connected':'Not connected'}</p></div><div class="card"><h2>ChatGPT integration</h2><p class="small muted">The app stores structured records ready for a secure MCP/API integration. ChatGPT read/write access is NOT active until that integration is deployed and authorized.</p></div>`;
$('saveGoals').onclick=()=>{data.goals=$('goals').value;store();alert('Training profile saved')};$('backup').onclick=()=>download('liftlog-backup.json',JSON.stringify(data,null,2),'application/json');$('restore').onchange=async e=>{try{let j=JSON.parse(await e.target.files[0].text());if(!j || !Array.isArray(j.records))throw Error('Not a LiftLog backup');if(confirm('Replace local history with this backup?')){const previous=data;data={...data,...j,restDays:Array.isArray(j.restDays)?j.restDays:[],overrides:j.overrides&&typeof j.overrides==='object'?j.overrides:{},goals:typeof j.goals==='string'?j.goals:data.goals};restDays();store();render()}}catch(e){alertErr(e)}};for(const id of ['connect','signup','upload','pull'])$(id).onclick=async()=>{try{config={url:$('url').value.trim().replace(/\/$/,''),key:$('key').value.trim(),email:$('email').value.trim()};localStorage.setItem(CONFIG,JSON.stringify(config));if(id==='connect'||id==='signup')await auth(id==='signup',$('password').value);if(id==='upload')await pushAll();if(id==='pull')await pullAll();$('cloudmsg').textContent=id+' succeeded';render()}catch(e){$('cloudmsg').textContent='Error: '+e.message;alertErr(e)}}}
async function auth(signup,password){if(!config.url.startsWith('https://')||!config.key||!config.email||!password)throw Error('Provide Supabase URL, publishable key, email and password');const endpoint=signup?'signup':'token?grant_type=password';const r=await fetch(config.url+'/auth/v1/'+endpoint,{method:'POST',headers:{'Content-Type':'application/json',apikey:config.key},body:JSON.stringify({email:config.email,password})});const j=await r.json();if(!r.ok)throw Error(j.msg||j.error_description||j.message||'Authentication failed');if(!j.access_token)throw Error('Check email to confirm account, then sign in');session=j;sessionStorage.setItem('liftlog-token',JSON.stringify(session))}
async function api(path,method='GET',body){if(!session){session=JSON.parse(sessionStorage.getItem('liftlog-token')||'null')}if(!session)throw Error('Sign in first');let r=await fetch(config.url+'/rest/v1/'+path,{method,headers:{apikey:config.key,Authorization:'Bearer '+session.access_token,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=representation'},body:body?JSON.stringify(body):undefined});if(!r.ok)throw Error('Cloud '+r.status+': '+(await r.text()).slice(0,300));return r.json()}
async function cloudUpsert(record){const user=JSON.parse(atob(session.access_token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).sub;await api('workout_records?on_conflict=user_id,id','POST',[{user_id:user,id:record.id,payload:record,updated_at:record.updated_at||new Date().toISOString()}])}
async function pushAll(){if(!session)throw Error('Sign in first');for(const r of data.records)await cloudUpsert(r)}
async function pullAll(){let cloud=await api('workout_records?select=id,payload,updated_at&limit=1000');let map=new Map(data.records.map(r=>[r.id,r]));for(const x of cloud){const local=map.get(x.id);if(!local||String(x.updated_at||'')>String(local.updated_at||''))map.set(x.id,x.payload)}data.records=[...map.values()];store()}
window.addEventListener('error',e=>alertErr(e.error||e.message));window.addEventListener('unhandledrejection',e=>alertErr(e.reason));init();
</script></body></html>
